<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Crud Usuarios</title>
  </head>

  <body class="bg-gray-100 min-h-screen w-full flex flex-col items-center m-5 gap-5">
    <div
      class="flex flex-col items-center gap-8 w-2xl m-7"
    >
      <form
        class="w-full p-10 md:p-8 bg-white rounded-lg shadow-lg flex flex-col gap-4"
        id="formulario"
      >
        <div>
          <input type="checkbox" id="activo" />
          <label for="activo" class="text-sm font-medium text-gray-700"
            >Activo</label
          >
        </div>

        <div class="flex flex-col gap-1">
          <label for="nombre" class="text-sm font-medium text-gray-700"
            >Nombre completo</label
          >
          <input
            type="text"
            id="nombre"
            class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="edad" class="text-sm font-medium text-gray-700"
            >Edad</label
          >
          <input
            type="number"
            id="edad"
            class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="telefono" class="text-sm font-medium text-gray-700"
            >Teléfono</label
          >
          <input
            type="text"
            id="telefono"
            class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="email" class="text-sm font-medium text-gray-700"
            >Email</label
          >
          <input
            type="email"
            id="email"
            class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="password" class="text-sm font-medium text-gray-700"
            >Contraseña</label
          >
          <input
            type="password"
            id="password"
            class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="password2" class="text-sm font-medium text-gray-700"
            >Repetir contraseña</label
          >
          <input
            type="password"
            id="password2"
            class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <p id="error" class="text-xs text-red-500 hidden">
          Ingresa valores validos en todos los campos
        </p>
        <button
          type="submit"
          id="btnGuardar"
          class="bg-indigo-500 text-white py-2 px-4 rounded-lg hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          Guardar
        </button>
      </form>

      <div id="listaUsuarios" class="p-10 md:p-8  bg-white rounded-lg shadow-lg flex flex-col gap-4">
        <h2 class="text-xl font-bold text-gray-700 mb-4">Lista de Usuarios</h2>
        <div class="overflow-x-auto w-full border border-gray-200 rounded-lg">
          <table class="w-full text-left border-collapse ">
            <thead>
              <tr class="bg-gray-100 border-b text-sm text-gray-600">
                <th class="p-2 text-center">ID</th>
                <th class="p-2 ">Nombre</th>
                <th class="p-2 text-center">Edad</th>
                <th class="p-2 ">Teléfono</th>
                <th class="p-2">Email</th>
                <th class="p-2 text-center">Estado</th>
              </tr>
            </thead>
            <tbody id="usuarios"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
