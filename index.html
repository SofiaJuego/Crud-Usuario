<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>

<body>
    <div class="flex h-screen items-center justify-center bg-gray-100">

        <form class="p-10 w-full max-w-md bg-white rounded-lg shadow-lg flex flex-col gap-4" id="formulario">

            <div>
                <input type="checkbox" id="activo">
                <label for="activo" class="text-sm font-medium text-gray-700">Activo</label>
            </div>

            <div class="flex flex-col gap-1">
                <label for="nombre" class="text-sm font-medium text-gray-700">Nombre completo</label>
                <input type="text" id="nombre"
                    class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex flex-col gap-1">
                <label for="edad" class="text-sm font-medium text-gray-700">Edad</label>
                <input type="number" id="edad"
                    class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex flex-col gap-1">
                <label for="telefono" class="text-sm font-medium text-gray-700">Teléfono</label>
                <input type="number" id="telefono"
                    class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex flex-col gap-1">
                <label for="email" class="text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email"
                    class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex flex-col gap-1">
                <label for="password" class="text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="password"
                    class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex flex-col gap-1">
                <label for="password2" class="text-sm font-medium text-gray-700">Repetir contraseña</label>
                <input type="password" id="password2"
                    class="border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500">
            </div>

            <p id="error" class="text-xs text-red-500 hidden">Ingresa valores validos en todos los campos</p>
            <button type="submit" id="btnGuardar"
                class="bg-indigo-500 text-white py-2 px-4 rounded-lg hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 ">Guardar</button>
        </form>

        <div id="listaUsuarios" class="p-10 w-full max-w-md bg-white rounded-lg shadow-lg flex flex-col gap-4">
            <h2 class="text-xl font-bold text-gray-700">Lista de Usuarios</h2>
            <ul id="usuarios" class="flex flex-col gap-2"></ul>
        </div>
    </div>


    <script type="module" src="./classes/Usuario.js"></script>
</body>

</html>
